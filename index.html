<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Mi presión</title>
</head>
<body>
  <header class="topbar">
    <img class="logo" src="/src/assets/logo.png" alt="" width="40" height="40">
    <h1>Mi presión</h1>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="settingsBtn" aria-label="Ajustes" aria-pressed="false">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main>
    <section id="view-registrar" data-view="registrar" aria-labelledby="t-registrar"></section>
    <section id="view-historial" data-view="historial" aria-labelledby="t-historial" hidden></section>
    <section id="view-resumen" data-view="resumen" aria-labelledby="t-resumen" hidden>
      <h2 class="view-title" id="t-resumen">Resumen</h2>
      <p class="card placeholder">Aquí verá su gráfica y sus promedios. Muy pronto.</p>
    </section>
    <section id="view-ajustes" data-view="ajustes" aria-labelledby="t-ajustes" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Secciones">
    <button type="button" data-tab="registrar" aria-current="page">
      <span class="pill"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      Registrar
    </button>
    <button type="button" data-tab="historial">
      <span class="pill"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
      Historial
    </button>
    <button type="button" data-tab="resumen">
      <span class="pill"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M5.5 15.5l4-5 3.5 3 5.5-7"/></svg></span>
      Resumen
    </button>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
